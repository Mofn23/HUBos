name: Build iOS IPA (SideStore Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode App & Package IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r HUBos.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUBos-iOS-IPA
          path: ios/App/build/HUBos.ipa

      - name: Release IPA on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: HUBos Super-App v2.2.0 (SideStore IPA)
          body: |
            ## 🚀 HUBos Super-App v2.2.0 (SideStore & AltStore Compatible)
            
            **HUBos** es un contenedor modular unificado para iOS que agrupa múltiples aplicaciones completas e independientes en un único archivo `.ipa`, permitiendo superar el límite estricto de 3 aplicaciones activas de SideStore / AltStore.

            ### 🌟 Novedades en Aesthetix v2.2:
            - **Solución Definitiva al Bloqueo de Teclado en iOS**: Conmutación de pantalla fluida sin modales superpuestos que previene el freeze de WebKit.
            - **Protocolo Personalizado PPL x UL**: Rutina oficial de 5 días de Samuel con 27 ejercicios exactos y visualización de GIFs animados en el catálogo y días de entrenamiento.
            - **Sistema de Rangos Symmetry (25 Niveles)**: De Hierro I a Simétrico (Top 1%) con insignias oficiales, percentiles globales y líneas anatómicas exactas (Rubí II, Esmeralda II, Diamante II).
            - **Volumen Histórico Acumulado (175.000+ kg)**, 112 entrenos, 204 PRs y racha de 7 días.
            - **Escaneo Físico IA con Gemini Vision**: Diagnóstico de simetría (0-100), porcentaje graso, ratio V-Taper y prescripción de entrenamiento.
            - **Lector de Capturas Symmetry con OCR IA**: Importación automática de entrenos y PRs desde capturas de pantalla.

            ### 📦 Módulos Incluidos en este Release:
            1. **🏠 HUB Launcher Dashboard**: Panel central con telemetría en vivo, acceso rápido con IA (Gemini 2.0 Flash) y conmutador flotante con 0ms de latencia.
            2. **🥑 Módulo RecompAI**: Conteo de calorías, distribución de macros, escáner de fotos/texto con IA, auditoría de capturas Symmetry, medidor de glucógeno y mapa de calor muscular.
            3. **📺 Módulo Subscriptions**: Gestor integral de suscripciones estilo MonAI/DinER, métricas de gasto mensual/anual, calendario de cobros, alertas de renovación y guías de cancelación en 1 tap.
            4. **📅 Módulo Horarios & Rutinas**: Matriz 2D de clases y conducción, Attendance Shield, gestor de tareas y sincronización .ics.
            5. **⚡ Módulo Aesthetix v2.2**: Hipertrofia & Fuerza, catálogo de 1.324 ejercicios con animaciones GIF, modo gimnasio fullscreen con descanso de 2:30 min, generador IA, protocolo PPL x UL, y sistema de rangos Symmetry.
            
            ### 📲 Instrucciones de Instalación en iPhone:
            1. Descarga el archivo `HUBos.ipa` adjunto abajo en tu iPhone.
            2. Abre **SideStore** (o AltStore).
            3. Ve a la pestaña **My Apps** ➔ Presiona **`+`** ➔ Selecciona `HUBos.ipa`.
            4. ¡Disfruta de todo tu ecosistema integrado en un solo slot activo!
          files: ios/App/build/HUBos.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
