name: Build HUBos version 2.7 (codex)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Archive and package IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HUBos.xcarchive \
            archive \
            MARKETING_VERSION=2.7 \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p build/Payload
          cp -R build/HUBos.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload HUBos-2.7-codex.ipa
          unzip -t HUBos-2.7-codex.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUBos-version-2.7-codex-IPA
          path: ios/App/build/HUBos-2.7-codex.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7-codex-${{ github.run_number }}
          name: HUBos version 2.7 (codex)
          body: |
            Build **${{ github.run_number }}** de HUBos version 2.7 (codex).

            Descarga `HUBos-2.7-codex.ipa` desde los archivos de este release. El IPA se compila sin certificado de distribución y se puede firmar e instalar desde SideStore o AltStore.
          files: ios/App/build/HUBos-2.7-codex.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
