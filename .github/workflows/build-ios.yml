name: Build iOS IPA (SideStore Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode App & Package IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r HUBos.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HUBos-iOS-IPA
          path: ios/App/build/HUBos.ipa

      - name: Release IPA on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: HUBos Super-App v2.5.0 (SideStore IPA)
          body: |
            ## 🚀 HUBos Super-App v2.5.0 (SideStore & AltStore Compatible)
            
            **HUBos** es un contenedor modular unificado para iOS que agrupa múltiples aplicaciones completas e independientes en un único archivo `.ipa`, permitiendo superar el límite estricto de 3 aplicaciones activas de SideStore / AltStore.

            ### 🌟 Novedades en HUBos & Aesthetix v2.5.0:
            - **Notificaciones In-App con Barra de Tiempo Animada (`ToastNotification.tsx`)**:
              - Temporizador automático de 3.5s con barra decreciente interactiva estilo RecompAI.
              - Eliminado el bug de notificaciones permanentes. Botón de descarte manual `✕`.
            - **Gym en Vivo con Cero Filtraciones (`LiveWorkoutFullscreen.tsx`)**:
              - Fondo negro puro OLED `#000000` con `pt-[max(env(safe-area-inset-top),44px)]` cubriendo el 100% de la pantalla y la barra de estado de iOS.
              - Botón de minimizar perfectamente centrado y carrusel de ejercicios con margen vertical generoso para anillos circulares sin cortes.
            - **Motor de Audio Biomecánico Nativo (`soundEffects.ts`)**:
              - Efecto sonoro "tic" táctil al completar una serie.
              - Chime armónico doble de campana de gimnasio al finalizar los 2:30 min de descanso.
              - Fanfarria de arpegio ascendente al superar un récord personal (PR).
            - **Detección de Récords Personales (PR) en Tiempo Real**:
              - Detección instantánea durante el entreno al superar cargas anteriores, con toast dorado conmemorativo y fanfarria auditiva.
            - **Resumen Celebratorio de Entrenamiento con IA y Memoria (`WorkoutSummaryCelebrationModal.tsx`)**:
              - Modal de finalización con confeti, métricas de volumen y series, racha actualizada a 7 días y análisis IA de sobrecarga progresiva comparando peso y reps contra la sesión anterior del mismo día.
            - **Dock de Navegación con Auto-Ocultamiento Inteligente**:
              - El dock inferior flotante se oculta automáticamente (`translate-y-28 opacity-0`) cada vez que se abre cualquier modal o bottom sheet, evitando colisiones con hojas como "Registrar Peso & Medidas".
            - **Récords Personales Colapsables en Perfil**:
              - Visualización de 4 PRs por defecto con botón interactivo de expansión/colapso.
            - **Modelo Anatómico Humano Oficial Symmetry & Visor de Ejercicios (`SymmetryAnatomyModel.tsx` & `SymmetryMuscleDetailSheet.tsx`)**:
              - Silueta atlética SVG de alta precisión sobre fondo OLED negro con contornos blancos definidos.
              - Vistas frontal y posterior alineadas lado a lado, iluminando cada grupo muscular con el color específico de su liga en Symmetry.
              - Al pulsar cualquier músculo (o tarjeta de la lista), se despliega la lámina de detalle con la insignia oficial y las tarjetas de ejercicios con sus respectivos rangos individuales.
            - **Racha de 7 Días Configurada**: Racha activa fijada en 7 días con 112 entrenamientos y 1,1 M kg anuales.

            ### 📦 Módulos Incluidos en este Release:
            1. **🏠 HUB Launcher Dashboard**: Panel central con telemetría en vivo, acceso rápido con IA (Gemini 2.0 Flash) y conmutador flotante con 0ms de latencia.
            2. **🥑 Módulo RecompAI**: Conteo de calorías, distribución de macros, escáner de fotos/texto con IA, auditoría de capturas Symmetry, medidor de glucógeno y mapa de calor muscular.
            3. **📺 Módulo Subscriptions**: Gestor integral de suscripciones estilo MonAI/DinER, métricas de gasto mensual/anual, calendario de cobros, alertas de renovación y guías de cancelación en 1 tap.
            4. **📅 Módulo Horarios & Rutinas**: Matriz 2D de clases y conducción, Attendance Shield, gestor de tareas y sincronización .ics.
            5. **⚡ Módulo Aesthetix v2.3**: Hipertrofia & Fuerza estilo Symmetry, catálogo de 1.324 ejercicios con animaciones GIF, modo gimnasio con descanso de 2:30 min, generador IA, protocolo PPL x UL, y sistema de rangos Symmetry.
            
            ### 📲 Instrucciones de Instalación en iPhone:
            1. Descarga el archivo `HUBos.ipa` adjunto abajo en tu iPhone.
            2. Abre **SideStore** (o AltStore).
            3. Ve a la pestaña **My Apps** ➔ Presiona **`+`** ➔ Selecciona `HUBos.ipa`.
            4. ¡Disfruta de todo tu ecosistema integrado en un solo slot activo!
          files: ios/App/build/HUBos.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
